<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FEQ — Calculateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0a0a">
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #1a0a0a;
  color: #f0ede8;
  font-family: -apple-system, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  height: 100%;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

*, *::before, *::after { box-sizing: border-box; }

.bg-photo {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: url('bg.jpg') center top / cover no-repeat;
  filter: brightness(0.25) saturate(1.3);
}

.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(180deg,
      rgba(26,10,10,0.3) 0%,
      rgba(26,10,10,0.55) 25%,
      rgba(26,10,10,0.82) 55%,
      rgba(26,10,10,0.95) 100%),
    radial-gradient(ellipse at 50% 0%, rgba(228,30,49,0.3) 0%, transparent 55%);
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 12px 14px 0;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
}

header {
  text-align: center;
  padding: 6px 0 10px;
  flex-shrink: 0;
}

h1 {
  font-size: 2.6rem;
  font-weight: 900;
  letter-spacing: 0.22em;
  color: #fff;
  line-height: 1;
  margin: 0;
  text-shadow:
    0 0 25px rgba(228,30,49,0.9),
    0 0 50px rgba(228,30,49,0.5),
    0 0 90px rgba(228,30,49,0.3);
}

.sub {
  font-size: 0.65rem;
  color: rgba(240,237,232,0.45);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  margin: 5px 0 0;
}

.header-total {
  font-size: 2rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: #E41E31;
  margin: 8px 0 0;
  text-shadow: 0 0 20px rgba(228,30,49,0.4);
  transition: transform 0.1s ease;
}
.header-total.bump { transform: scale(1.08); }

.products {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  justify-content: center;
}

.card {
  background: rgba(20,8,8,0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(228,30,49,0.08);
  border-radius: 12px;
  padding: 10px 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.card.active {
  border-color: rgba(228,30,49,0.4);
  box-shadow: 0 0 20px rgba(228,30,49,0.1), inset 0 0 16px rgba(228,30,49,0.04);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  gap: 8px;
}

.card-name {
  font-size: 0.92rem;
  font-weight: 700;
}

.card-unit {
  font-size: 0.65rem;
  color: rgba(240,237,232,0.3);
  white-space: nowrap;
  flex-shrink: 0;
}

.stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  line-height: 1;
  flex-shrink: 0;
  transition: transform 0.08s ease;
  -webkit-appearance: none;
  appearance: none;
}

.btn:active:not(:disabled) { transform: scale(0.86); }
.btn:focus-visible { outline: 2px solid #E41E31; outline-offset: 3px; }

.btn-minus {
  background: rgba(255,255,255,0.06);
  color: rgba(240,237,232,0.3);
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-minus:active:not(:disabled) {
  background: rgba(255,255,255,0.12);
  color: rgba(240,237,232,0.6);
}
.btn-minus:disabled { opacity: 0.15; cursor: default; }

.btn-plus {
  background: #E41E31;
  color: #fff;
  box-shadow: 0 3px 14px rgba(228,30,49,0.4);
}
.btn-plus:active {
  background: #ff3050;
  box-shadow: 0 3px 18px rgba(255,48,80,0.5);
}

.qty-block { text-align: center; min-width: 70px; }

.qty-num {
  font-size: 2.2rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: #fff;
  transition: color 0.15s;
}
.qty-num.zero { color: rgba(255,255,255,0.1); }

.qty-detail {
  font-size: 0.62rem;
  color: rgba(240,237,232,0.35);
  margin-top: 1px;
  min-height: 0.9em;
}

.card-bottom {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(228,30,49,0.08);
}

.subtotal {
  font-size: 0.95rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #E41E31;
  transition: color 0.15s;
}
.subtotal.zero { color: rgba(228,30,49,0.15); }

.actions {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  justify-content: center;
  flex-shrink: 0;
}

.reset {
  background: rgba(228,30,49,0.15);
  border: 1px solid rgba(228,30,49,0.3);
  color: #E41E31;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  padding: 12px 32px;
  border-radius: 25px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
}
.reset:active { background: rgba(228,30,49,0.3); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .btn, .total-amount, .card, .qty-num, .subtotal { transition: none !important; }
}
</style>
</head>
<body>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>

<div class="app">
  <header>
    <h1>FEQ</h1>
    <p class="sub">Calculateur de boissons</p>
    <div class="header-total" id="header-total">0,00 $</div>
  </header>
  <div id="products" class="products"></div>
  <div class="actions" id="actions" hidden>
    <button id="reset" class="reset">Tout effacer</button>
  </div>
</div>


<script>
var P = [
  { id:'coors',   name:'Coors Light',   unit:'219 $ / cs de 24', step:1, sp:219,   cases:true },
  { id:'seltzer', name:'Coors Seltzer', unit:'63,75 $ / 6',     step:6, sp:63.75 },
  { id:'eau',     name:'Eau',           unit:'21,50 $ / 6',     step:6, sp:21.50 }
];

var S = {};
P.forEach(function(p){ S[p.id] = 0; });

function fmt(n) {
  var s = n.toFixed(2).split('.');
  var i = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return i + ',' + s[1] + ' $';
}

function sub(p) {
  var q = S[p.id];
  return p.step === 1 ? q * p.sp : (q / p.step) * p.sp;
}

function detail(p) {
  var q = S[p.id];
  if (!q) return ' ';
  if (p.cases) return (q * 24) + ' canettes';
  return ' ';
}

function render() {
  var grand = 0, any = false;
  P.forEach(function(p) {
    var q = S[p.id], st = sub(p);
    grand += st;
    if (q > 0) any = true;

    document.getElementById('q-' + p.id).textContent = q;
    document.getElementById('q-' + p.id).className = 'qty-num' + (q === 0 ? ' zero' : '');
    document.getElementById('d-' + p.id).textContent = detail(p);
    document.getElementById('s-' + p.id).textContent = fmt(st);
    document.getElementById('s-' + p.id).className = 'subtotal' + (q === 0 ? ' zero' : '');
    document.getElementById('c-' + p.id).className = 'card' + (q > 0 ? ' active' : '');
    document.getElementById('m-' + p.id).disabled = q === 0;
  });

  var te = document.getElementById('header-total');
  te.textContent = fmt(grand);
  te.classList.add('bump');
  setTimeout(function(){ te.classList.remove('bump'); }, 120);
  document.getElementById('actions').hidden = !any;
}

function chg(id, dir) {
  var p;
  for (var i = 0; i < P.length; i++) { if (P[i].id === id) { p = P[i]; break; } }
  var nv = S[id] + dir * p.step;
  if (nv < 0) return;
  S[id] = nv;
  render();
}

document.addEventListener('DOMContentLoaded', function() {
  var c = document.getElementById('products');
  P.forEach(function(p) {
    var el = document.createElement('div');
    el.className = 'card';
    el.id = 'c-' + p.id;
    el.innerHTML =
      '<div class="card-top">' +
        '<span class="card-name">' + p.name + '</span>' +
        '<span class="card-unit">' + p.unit + '</span>' +
      '</div>' +
      '<div class="stepper">' +
        '<button class="btn btn-minus" id="m-' + p.id + '" disabled ' +
          'aria-label="Enlever ' + p.name + '">−</button>' +
        '<div class="qty-block">' +
          '<div class="qty-num zero" id="q-' + p.id + '">0</div>' +
          '<div class="qty-detail" id="d-' + p.id + '"> </div>' +
        '</div>' +
        '<button class="btn btn-plus" id="p-' + p.id + '" ' +
          'aria-label="Ajouter ' + p.name + '">+</button>' +
      '</div>' +
      '<div class="card-bottom">' +
        '<span class="subtotal zero" id="s-' + p.id + '">' + fmt(0) + '</span>' +
      '</div>';
    c.appendChild(el);

    document.getElementById('m-' + p.id).addEventListener('click', function(){ chg(p.id, -1); });
    document.getElementById('p-' + p.id).addEventListener('click', function(){ chg(p.id, 1); });
  });

  document.getElementById('reset').addEventListener('click', function() {
    P.forEach(function(p){ S[p.id] = 0; });
    render();
  });

});
</script>
</body>
</html>
