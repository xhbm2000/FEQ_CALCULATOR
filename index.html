<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FEQ — Calculateur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F2FF">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>
:root {
  --bg: #F4F2FF;
  --surface: rgba(255,255,255,0.88);
  --surface-active: rgba(255,255,255,0.95);
  --text: #141428;
  --text-muted: #8A86A0;
  --blue: #3D5AFE;
  --pink: #FF2D78;
  --green: #00D26A;
  --border: rgba(0,0,0,0.06);
  --border-active: rgba(61,90,254,0.22);
}

html {
  background: var(--bg);
}

body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

*, *::before, *::after { box-sizing: border-box; }

.bg-photo {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: url('bg.jpg') center top / cover no-repeat;
  filter: brightness(1.6) saturate(0.3) contrast(0.7);
  opacity: 0.18;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(61,90,254,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 0%, rgba(255,45,120,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(0,210,106,0.05) 0%, transparent 40%),
    linear-gradient(180deg, rgba(244,242,255,0.7) 0%, rgba(244,242,255,0.92) 100%);
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

header {
  text-align: center;
  padding: 12px 0 6px;
  flex-shrink: 0;
}

.feq-logo {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 2px;
}

.feq-logo span {
  font-size: clamp(2rem, 7vw, 2.8rem);
  font-weight: 900;
  letter-spacing: 0.08em;
  line-height: 1;
  display: inline-block;
}
.feq-logo .l-f { color: var(--blue); }
.feq-logo .l-e { color: var(--pink); }
.feq-logo .l-q { color: var(--green); }

.festival-name {
  font-size: 0.55rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.22em;
  margin: 4px 0 0;
}

.header-divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--pink), var(--green));
  margin: 8px auto 6px;
  border: none;
  border-radius: 2px;
}

.header-total {
  font-size: clamp(1.4rem, 5vw, 1.8rem);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  margin: 0;
  transition: transform 0.1s ease;
}
.header-total.zero { color: #C8C4D8; }
.header-total.bump { transform: scale(1.06); }

.header-total-label {
  font-size: 0.5rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  margin: 1px 0 0;
}

.products {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
  justify-content: center;
  padding: 4px 0;
}

.card {
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 2px 8px rgba(61,90,254,0.04);
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  position: relative;
  overflow: hidden;
}

.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--blue), var(--pink), var(--green));
  opacity: 0;
  transition: opacity 0.25s ease;
}

.card.active {
  background: var(--surface-active);
  border-color: var(--border-active);
  box-shadow: 0 4px 16px rgba(61,90,254,0.08);
}
.card.active::after { opacity: 1; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
  gap: 6px;
}

.card-name { font-size: 0.88rem; font-weight: 700; color: var(--text); }
.card-unit { font-size: 0.58rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

.stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.btn {
  width: clamp(40px, 11vw, 48px);
  height: clamp(40px, 11vw, 48px);
  border-radius: 50%;
  border: none;
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  line-height: 1;
  flex-shrink: 0;
  transition: transform 0.08s ease;
  -webkit-appearance: none;
  appearance: none;
}

.btn:active:not(:disabled) { transform: scale(0.88); }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.btn-minus {
  background: rgba(61,90,254,0.06);
  color: #9A94B8;
  border: 1.5px solid rgba(61,90,254,0.08);
}
.btn-minus:active:not(:disabled) {
  background: rgba(61,90,254,0.12);
  color: var(--text);
}
.btn-minus:disabled { opacity: 0.25; cursor: default; }

.btn-plus {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 4px 14px rgba(61,90,254,0.30);
}
.btn-plus:active {
  background: #304FFE;
}

.qty-block { text-align: center; min-width: 64px; }

.qty-num {
  font-size: clamp(1.8rem, 6vw, 2.2rem);
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: var(--text);
  transition: color 0.15s, transform 0.1s ease;
}
.qty-num.zero { color: #C8C4D8; }
.qty-num.pop { transform: scale(1.12); }

.qty-detail {
  font-size: 0.55rem;
  color: var(--text-muted);
  margin-top: 1px;
  min-height: 0.8em;
}

.card-bottom {
  display: flex;
  justify-content: flex-end;
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px solid var(--border);
}

.subtotal {
  font-size: 0.9rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--blue);
}
.subtotal.zero { color: #C8C4D8; }

.actions {
  display: flex;
  padding: 8px 0 4px;
  justify-content: center;
  flex-shrink: 0;
}

.reset {
  background: var(--pink);
  border: none;
  color: #fff;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  padding: 12px 38px;
  border-radius: 28px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  box-shadow: 0 3px 12px rgba(255,45,120,0.25);
}
.reset:active { background: #E0204F; }

.disclaimer {
  flex-shrink: 0;
  text-align: center;
  padding: 8px 10px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  font-size: 0.5rem;
  line-height: 1.5;
  color: #908CA6;
  letter-spacing: 0.01em;
}

.disclaimer a {
  color: #7A76A0;
  text-decoration: none;
}

.login-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  padding: 20px;
}

.login-screen.hidden { display: none; }

.login-logo {
  display: flex;
  gap: 6px;
}
.login-logo span {
  font-size: 4rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  line-height: 1;
}
.login-logo .l-f { color: var(--blue); }
.login-logo .l-e { color: var(--pink); }
.login-logo .l-q { color: var(--green); }

.login-sub {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--text-muted);
  margin: 0;
}

.login-form {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  width: 100%;
  max-width: 280px;
}

.login-input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: rgba(255,255,255,0.7);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  letter-spacing: 0.1em;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.login-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(61,90,254,0.12);
}
.login-input.error {
  border-color: var(--pink);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.login-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--blue);
  color: #fff;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  box-shadow: 0 4px 14px rgba(61,90,254,0.25);
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
}
.login-btn:active { background: #304FFE; }

.login-error {
  font-size: 0.72rem;
  color: var(--pink);
  font-weight: 600;
  min-height: 1.2em;
}

@media (prefers-reduced-motion: reduce) {
  .btn, .header-total, .card, .qty-num, .subtotal { transition: none !important; }
  .login-input.error { animation: none !important; }
}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-logo">
    <span class="l-f">F</span><span class="l-e">E</span><span class="l-q">Q</span>
  </div>
  <p class="login-sub">Calculateur de boissons</p>
  <div class="login-form">
    <input type="password" class="login-input" id="login-pw" placeholder="Mot de passe" autocomplete="off">
    <button class="login-btn" id="login-btn">Entrer</button>
    <div class="login-error" id="login-error">&nbsp;</div>
  </div>
</div>

<div class="bg-photo"></div>
<div class="bg-overlay"></div>

<div class="app" id="app" style="display:none">
  <header>
    <div class="feq-logo">
      <span class="l-f">F</span><span class="l-e">E</span><span class="l-q">Q</span>
    </div>
    <p class="festival-name">Festival d'été de Québec</p>
    <hr class="header-divider">
    <div class="header-total zero" id="header-total">0,00 $</div>
    <p class="header-total-label">Total de la commande</p>
  </header>
  <div id="products" class="products"></div>
  <div class="actions" id="actions" hidden>
    <button id="reset" class="reset">Tout effacer</button>
  </div>
  <div class="disclaimer">
    Ce site n'est pas affilié au Festival d'été de Québec (FEQ) ni à ses organisateurs.<br>
    Outil personnel créé par Hans B. Martel — <a href="tel:4389203550">438-920-3550</a>
  </div>
</div>

<script>
(function() {
  var PWD = 'zone1';
  var ls = document.getElementById('login-screen');
  var pw = document.getElementById('login-pw');
  var btn = document.getElementById('login-btn');
  var err = document.getElementById('login-error');

  if (sessionStorage.getItem('feq_auth') === '1') {
    ls.classList.add('hidden');
    document.getElementById('app').style.display = '';
  }

  function tryLogin() {
    var val = pw.value.trim().replace(/\s/g, '').toLowerCase();
    if (val === PWD) {
      sessionStorage.setItem('feq_auth', '1');
      ls.classList.add('hidden');
      document.getElementById('app').style.display = '';
    } else {
      pw.classList.add('error');
      err.textContent = 'Mot de passe incorrect';
      setTimeout(function(){ pw.classList.remove('error'); }, 500);
    }
  }

  btn.addEventListener('click', tryLogin);
  pw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') tryLogin();
  });
})();

var P = [
  { id:'coors',   name:'Coors Light',   unit:'219 $ / cs de 24', step:1, sp:219,   cases:true },
  { id:'seltzer', name:'Coors Seltzer', unit:'63,75 $ / 6',     step:6, sp:63.75 },
  { id:'eau',     name:'Eau',           unit:'43 $ / 12',       step:12, sp:43 }
];

var S = {};
P.forEach(function(p){ S[p.id] = 0; });

function fmt(n) {
  var s = n.toFixed(2).split('.');
  var i = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return i + ',' + s[1] + ' $';
}

function sub(p) {
  var q = S[p.id];
  return p.step === 1 ? q * p.sp : (q / p.step) * p.sp;
}

function detail(p) {
  var q = S[p.id];
  if (!q) return ' ';
  if (p.cases) return (q * 24) + ' canettes';
  return ' ';
}

function render(changedId) {
  var grand = 0, any = false;
  P.forEach(function(p) {
    var q = S[p.id], st = sub(p);
    grand += st;
    if (q > 0) any = true;

    var qEl = document.getElementById('q-' + p.id);
    qEl.textContent = q;
    qEl.className = 'qty-num' + (q === 0 ? ' zero' : '');
    if (changedId === p.id) {
      qEl.classList.add('pop');
      setTimeout(function(){ qEl.classList.remove('pop'); }, 120);
    }

    document.getElementById('d-' + p.id).textContent = detail(p);
    document.getElementById('s-' + p.id).textContent = fmt(st);
    document.getElementById('s-' + p.id).className = 'subtotal' + (q === 0 ? ' zero' : '');
    document.getElementById('c-' + p.id).className = 'card' + (q > 0 ? ' active' : '');
    document.getElementById('m-' + p.id).disabled = q === 0;
  });

  var te = document.getElementById('header-total');
  te.textContent = fmt(grand);
  te.className = 'header-total' + (grand === 0 ? ' zero' : '');
  te.classList.add('bump');
  setTimeout(function(){ te.classList.remove('bump'); }, 130);
  document.getElementById('actions').hidden = !any;
}

function chg(id, dir) {
  var p;
  for (var i = 0; i < P.length; i++) { if (P[i].id === id) { p = P[i]; break; } }
  var nv = S[id] + dir * p.step;
  if (nv < 0) return;
  S[id] = nv;
  render(id);
}

document.addEventListener('DOMContentLoaded', function() {
  var c = document.getElementById('products');
  P.forEach(function(p) {
    var el = document.createElement('div');
    el.className = 'card';
    el.id = 'c-' + p.id;
    el.innerHTML =
      '<div class="card-top">' +
        '<span class="card-name">' + p.name + '</span>' +
        '<span class="card-unit">' + p.unit + '</span>' +
      '</div>' +
      '<div class="stepper">' +
        '<button class="btn btn-minus" id="m-' + p.id + '" disabled ' +
          'aria-label="Enlever ' + p.name + '">−</button>' +
        '<div class="qty-block">' +
          '<div class="qty-num zero" id="q-' + p.id + '">0</div>' +
          '<div class="qty-detail" id="d-' + p.id + '"> </div>' +
        '</div>' +
        '<button class="btn btn-plus" id="p-' + p.id + '" ' +
          'aria-label="Ajouter ' + p.name + '">+</button>' +
      '</div>' +
      '<div class="card-bottom">' +
        '<span class="subtotal zero" id="s-' + p.id + '">' + fmt(0) + '</span>' +
      '</div>';
    c.appendChild(el);

    document.getElementById('m-' + p.id).addEventListener('click', function(){ chg(p.id, -1); });
    document.getElementById('p-' + p.id).addEventListener('click', function(){ chg(p.id, 1); });
  });

  document.getElementById('reset').addEventListener('click', function() {
    P.forEach(function(p){ S[p.id] = 0; });
    render();
  });
});
</script>
</body>
</html>
